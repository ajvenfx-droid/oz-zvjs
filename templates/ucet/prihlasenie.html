{% extends "base.html" %}
{% block title %}Prihlásenie – {{ nazov_zvazu }}{% endblock %}
{% block content %}
  <h1 class="nadpis">Prihlásenie člena</h1>
  <form method="post" class="formular formular--uzky">
    <label class="pole">
      <span class="pole__nazov">E-mail</span>
      <input type="text" name="cislo" required autofocus autocomplete="username" value="{{ request.form.get('cislo', '') }}">
    </label>
    <label class="pole">
      <span class="pole__nazov">Heslo</span>
      <input type="password" name="heslo" required autocomplete="current-password">
    </label>
    <button type="submit" class="tlacidlo">Prihlásiť sa</button>
  </form>
  <p><a href="{{ url_for('ucet.zabudnute_heslo') }}">Zabudli ste heslo?</a></p>
{% endblock %}
